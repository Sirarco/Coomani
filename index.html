<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COOMANI | Noticias de Anime</title>
    
    <!-- NUEVO: Favicon simple con emoji -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
    
    <!-- Íconos Modernos Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-main: #1c1e21;
            --text-muted: #65676b;
            --primary: #ff6b00;
            --primary-hover: #e65c00;
            --radius: 20px; 
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 60px;
        }
        
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            z-index: 1000;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 0 10px 0;
            transition: var(--transition);
            box-sizing: border-box;
        }
        header.shrink {
            padding: 8px 0 6px 0;
            background: rgba(255, 255, 255, 0.95);
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 800px;
            padding: 0 20px;
            box-sizing: border-box;
            margin-bottom: 8px;
            transition: var(--transition);
        }
        header.shrink .header-top { margin-bottom: 4px; }
        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--text-main);
            letter-spacing: -1px;
            display: flex;
            align-items: center;
            gap: 4px;
            text-transform: uppercase;
            transition: var(--transition);
        }
        header.shrink .logo { font-size: 1.2rem; }
        .logo span { color: var(--primary); }
        
        .login-btn {
            background: var(--text-main);
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.85rem;
            transition: var(--transition);
        }
        .login-btn:hover { background: var(--primary); }

        .filters {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            width: 100%;
            max-width: 800px;
            padding: 0 20px 6px 20px;
            box-sizing: border-box;
            scrollbar-width: none;
            justify-content: center;
            flex-wrap: wrap;
        }
        .filters::-webkit-scrollbar { display: none; }
        .filter-btn {
            background: #f3f4f6;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.8rem;
            color: var(--text-muted);
            white-space: nowrap;
            transition: var(--transition);
        }
        .filter-btn:hover { background: #e5e7eb; }
        .filter-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 10px rgba(255, 107, 0, 0.3);
        }
        .toggle-tags-btn { background: var(--text-main); color: white; }
        .toggle-tags-btn:hover { background: #333; }

        .view-tabs {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 6px;
            width: 100%;
        }
        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            padding-bottom: 4px;
            border-bottom: 2px solid transparent;
            transition: var(--transition);
        }
        .tab-btn.active {
            color: var(--text-main);
            border-bottom: 2px solid var(--primary);
        }

        .spacer { height: 140px; transition: var(--transition); }
        header.shrink + .spacer { height: 100px; }
        
        /* NUEVO: Animación de Carga Kawaii */
        #loader { 
            padding: 40px 20px; 
            text-align: center; 
            color: var(--text-muted); 
            font-weight: 700;
            font-size: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .kawaii-emojis {
            display: flex;
            gap: 12px;
            font-size: 2rem;
        }
        .kawaii-emojis span {
            animation: bounce 0.6s infinite alternate cubic-bezier(0.5, 0.05, 1, 0.5);
        }
        .kawaii-emojis span:nth-child(2) { animation-delay: 0.2s; }
        .kawaii-emojis span:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-15px); }
        }
        
        main {
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            box-sizing: border-box;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
            flex: 1;
        }
        
        .news-card {
            background: transparent;
            perspective: 1000px;
            height: 460px;
            cursor: pointer;
        }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            border-radius: var(--radius);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .news-card.flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: var(--radius);
            background: var(--card-bg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(0,0,0,0.04);
            box-sizing: border-box;
        }
        .card-front { justify-content: space-between; }
        .card-back {
            transform: rotateY(180deg);
            padding: 24px;
            justify-content: space-between;
            background: #ffffff;
        }
        .card-img { width: 100%; height: 190px; object-fit: cover; background-color: #e5e7eb; }
        .card-content {
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: space-between;
        }
        .card-header-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .date { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; }
        .title { font-size: 1.1rem; font-weight: 800; color: var(--text-main); margin: 0 0 10px 0; line-height: 1.3; }
        .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
        
        .tag {
            font-size: 0.65rem;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @media (hover: hover) { .tag:hover { transform: scale(1.08); } }
        .tag:active { transform: scale(0.95); }

        .back-title { font-size: 1rem; font-weight: 800; color: var(--text-main); margin-bottom: 12px; border-bottom: 2px solid var(--primary); padding-bottom: 6px; }
        .back-text { font-size: 0.9rem; color: var(--text-main); line-height: 1.5; overflow-y: auto; flex: 1; margin-bottom: 12px; }
        .source-link { display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--primary); text-decoration: none; font-weight: 800; margin-bottom: 12px; }
        .source-link:hover { text-decoration: underline; }
        
        .actions { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #f0f2f5; padding-top: 12px; }
        .btn-group { display: flex; gap: 8px; }
        
        .action-btn {
            background: #f9fafb;
            border: 1px solid #f3f4f6;
            cursor: pointer;
            color: var(--text-muted);
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: 50%;
        }
        .action-btn:hover { background: #f3f4f6; transform: scale(1.1); color: var(--primary); }
        
        @keyframes heartPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.4); }
            100% { transform: scale(1); }
        }
        .action-btn.liked { color: #ff3b30; border-color: #ff3b30; }
        .action-btn.liked i { fill: #ff3b30; animation: heartPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        .btn-read { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 20px; font-weight: 800; font-size: 0.85rem; cursor: pointer; transition: var(--transition); box-shadow: 0 4px 10px rgba(255, 107, 0, 0.2); }
        .btn-read:hover { background: var(--primary-hover); transform: scale(1.05); }
        
        .btn-cargar-mas { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 20px; font-weight: 800; cursor: pointer; margin: 10px auto 30px auto; display: block; transition: var(--transition); box-shadow: 0 4px 10px rgba(255, 107, 0, 0.2); }
        .btn-cargar-mas:hover { background: var(--primary-hover); transform: scale(1.05); }

        footer { position: fixed; bottom: 0; left: 0; width: 100%; background-color: #ffffff; border-top: 1px solid #e5e7eb; padding: 0 20px; height: 50px; display: flex; flex-direction: row; align-items: center; justify-content: space-between; box-sizing: border-box; z-index: 1000; }
        .social-icons { display: flex; gap: 16px; }
        .social-icons a { color: var(--text-muted); text-decoration: none; transition: var(--transition); display: flex; align-items: center; }
        .social-icons a:hover { color: var(--primary); transform: translateY(-2px); }
        .footer-info { font-size: 0.8rem; color: var(--text-muted); display: flex; gap: 8px; align-items: center; }
        .footer-info code { background: #f3f4f6; padding: 2px 6px; border-radius: 6px; font-weight: 700; color: var(--primary); }

        .cookie-banner {
            position: fixed;
            bottom: 50px; 
            left: 0;
            width: 100%;
            background: #1c1e21;
            color: #fff;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 999;
            box-sizing: border-box;
            font-size: 0.85rem;
            transform: translateY(100%);
            transition: transform 0.4s ease-in-out;
        }
        .cookie-banner.show { transform: translateY(0); }
        .cookie-banner button { background: var(--primary); color: white; border: none; padding: 6px 14px; border-radius: 12px; font-weight: 700; cursor: pointer; }

        @media (max-width: 768px) {
            html { scroll-snap-type: y mandatory; }
            main { grid-template-columns: 1fr; }
            .news-card { scroll-snap-align: center; scroll-margin-top: 140px; }
            .tag { font-size: 0.85rem; padding: 5px 12px; }
            footer { justify-content: center; gap: 15px; }
            .footer-info span:first-child { display: none; }
        }
    </style>
</head>
<body>
    <header id="main-header">
        <div class="header-top">
            <div class="logo">COOMANI<span>.</span></div>
            <button class="login-btn" id="auth-btn">Log In</button>
        </div>
        <div class="filters" id="filter-container"></div>
        <div class="view-tabs" id="view-tabs">
            <button class="tab-btn active" data-view="todo">Todo</button>
            <button class="tab-btn" data-view="feed">Tu Feed</button>
            <button class="tab-btn" data-view="likes">Tus Me Gusta</button>
        </div>
    </header>
    <div class="spacer"></div>
    
    <!-- NUEVO: Loader y mensaje modificado -->
    <div id="loader">
        <div class="kawaii-emojis">
            <span>🕵️‍♀️</span>
            <span>🔎</span>
            <span>🌸</span>
        </div>
        <span id="loader-text">Investigando las mejores noticias para ti...</span>
    </div>
    
    <main id="feed"></main>
    <button id="btn-cargar-mas" class="btn-cargar-mas" style="display: none;">Cargar más noticias</button>

    <div id="cookie-banner" class="cookie-banner">
        <span>Utilizamos cookies para guardar tus preferencias de "Me gusta" y mejorar tus recomendaciones.</span>
        <button id="accept-cookies">Entendido</button>
    </div>

    <footer>
        <div class="social-icons">
            <a href="https://www.instagram.com/" target="_blank" rel="noopener" title="Instagram"><i data-lucide="instagram" style="width: 18px;"></i></a>
            <a href="https://www.tiktok.com/" target="_blank" rel="noopener" title="TikTok">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"/></svg>
            </a>
            <a href="#" title="Twitter / X"><i data-lucide="twitter" style="width: 18px;"></i></a>
        </div>
        <div class="footer-info">
            <span>© 2026 COOMANI. Todos los derechos reservados.</span>
            <span>|</span>
            <span>code: <code>VINI</code></span>
        </div>
    </footer>

<script>
    // ==========================================
    // CONFIGURACIÓN DE APIS
    // ==========================================
    const API_URL = "https://script.google.com/macros/s/AKfycbwmSPoefuWxpL9qpydTGhLFgPepxdDZ0tY4db4uAUippymIcErFBAmTSGMbmiTDtDUC/exec";      
    
    const SUPABASE_URL = 'https://keohrixjwiwzkrntfkht.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtlb2hyaXhqd2l3emtybnRma2h0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwNjg1MzgsImV4cCI6MjEwNzY0NDUzOH0.p8CuDNNUpr1veC5ZzFGKhaFgfr171SQNpiWRgvpbujE';
    
    // CORRECCIÓN: Renombramos la variable a supabaseClient
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ==========================================
    // VARIABLES GLOBALES
    // ==========================================
    let newsData = [];
    let selectedTags = new Set(); 
    let limiteNoticias = 25;
    let tagsExpandidos = false;
    let currentView = 'todo'; 
    
    let currentUser = null;
    let userLikes = new Set();

    const feedContainer = document.getElementById('feed');
    const filterContainer = document.getElementById('filter-container');
    const loader = document.getElementById('loader');
    const loaderText = document.getElementById('loader-text');
    const btnCargarMas = document.getElementById('btn-cargar-mas');
    const authBtn = document.getElementById('auth-btn');

    // ==========================================
    // LÓGICA DE AUTENTICACIÓN Y BASE DE DATOS
    // ==========================================
    supabaseClient.auth.onAuthStateChange((event, session) => {
        if (session) {
            currentUser = session.user;
            authBtn.innerText = "Cerrar Sesión";
            authBtn.onclick = async () => { await supabaseClient.auth.signOut(); window.location.reload(); };
            fetchUserLikes();
        } else {
            currentUser = null;
            userLikes.clear();
            authBtn.innerText = "Log In";
            authBtn.onclick = async () => { await supabaseClient.auth.signInWithOAuth({ provider: 'google' }); };
            if(newsData.length > 0) renderFeed();
        }
    });

    async function fetchUserLikes() {
        if (!currentUser) return;
        const { data, error } = await supabaseClient.from('user_likes').select('news_id');
        if (data) {
            userLikes = new Set(data.map(d => String(d.news_id)));
        }
        if(newsData.length > 0) renderFeed();
    }

    async function toggleLike(e, newsId, btnEl) {
        e.stopPropagation();
        if (!currentUser) {
            alert("Debes iniciar sesión para guardar tus noticias favoritas.");
            return;
        }

        const idStr = String(newsId);
        const icon = btnEl.querySelector('i');

        if (userLikes.has(idStr)) {
            userLikes.delete(idStr);
            btnEl.classList.remove('liked');
            icon.setAttribute('fill', 'none');
            await supabaseClient.from('user_likes').delete().match({ user_id: currentUser.id, news_id: idStr });
        } else {
            userLikes.add(idStr);
            btnEl.classList.add('liked');
            icon.setAttribute('fill', '#ff3b30');
            await supabaseClient.from('user_likes').insert([{ user_id: currentUser.id, news_id: idStr }]);
        }
        
        if(currentView === 'likes') renderFeed();
    }

    // ==========================================
    // EVENTOS DE UI GENERAL
    // ==========================================
    window.addEventListener('scroll', () => {
        if (window.scrollY > 40) header.classList.add('shrink');
        else header.classList.remove('shrink');
    });

    if (!localStorage.getItem('cookiesAccepted')) {
        setTimeout(() => document.getElementById('cookie-banner').classList.add('show'), 1500);
    }
    document.getElementById('accept-cookies').addEventListener('click', () => {
        localStorage.setItem('cookiesAccepted', 'true');
        document.getElementById('cookie-banner').classList.remove('show');
    });

    document.getElementById('view-tabs').addEventListener('click', (e) => {
        if(e.target.classList.contains('tab-btn')) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            e.target.classList.add('active');
            currentView = e.target.dataset.view;
            limiteNoticias = 25;
            renderFeed();
        }
    });

    // ==========================================
    // UTILIDADES DE DATOS
    // ==========================================
    const tagColors = [
        { bg: '#fff0e6', text: '#cc5500' }, { bg: '#e0f2fe', text: '#0369a1' }, 
        { bg: '#fce7f3', text: '#be185d' }, { bg: '#fef3c7', text: '#b45309' }, 
        { bg: '#f3e8ff', text: '#6b21a8' }, { bg: '#dcfce7', text: '#15803d' }, 
        { bg: '#fee2e2', text: '#991b1b' }  
    ];

    function getTagStyle(tagName) {
        let hash = 0;
        for (let i = 0; i < tagName.length; i++) hash = tagName.charCodeAt(i) + ((hash << 5) - hash);
        const index = Math.abs(hash) % tagColors.length;
        return `background-color: ${tagColors[index].bg}; color: ${tagColors[index].text};`;
    }

    function formatDate(dateStr) {
        if(!dateStr) return 'Reciente';
        const d = new Date(dateStr);
        if(isNaN(d)) return 'Reciente';
        const dd = String(d.getDate()).padStart(2, '0');
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const yy = String(d.getFullYear()).slice(-2);
        return `${dd}:${mm}:${yy}`;
    }

    function shareNews(e, title, url) {
        e.stopPropagation();
        if (navigator.share) {
            navigator.share({ title: title, text: 'Mira esta noticia en COOMANI', url: url }).catch(console.error);
        } else {
            alert("La función de compartir no está soportada en este navegador.");
        }
    }

    // ==========================================
    // CARGA Y RENDERIZADO
    // ==========================================
    async function fetchNews() {
        try {
            const response = await fetch(API_URL, { method: 'GET', mode: 'cors', redirect: 'follow' });
            const data = await response.json();
            
            newsData = data.sort((a, b) => new Date(b.date) - new Date(a.date));
            
            loader.style.display = 'none';
            generateFilters(newsData);
            renderFeed();
        } catch (error) {
            console.error("Error de carga:", error);
            // NUEVO: Mensaje de error personalizado sin mencionar código/hojas
            document.querySelector('.kawaii-emojis').innerHTML = "<span>(ಥ﹏ಥ)</span>";
            loaderText.innerText = "Oops... No pudimos encontrar las noticias. ¡Inténtalo de nuevo más tarde!";
        }
    }

    function generateFilters(data) {
        const conteoTags = {};
        data.forEach(news => {
            news.tags.forEach(tag => { conteoTags[tag] = (conteoTags[tag] || 0) + 1; });
        });

        const tagsOrdenados = Object.keys(conteoTags).sort((a, b) => conteoTags[b] - conteoTags[a]);
        filterContainer.innerHTML = `<button class="filter-btn ${selectedTags.size === 0 ? 'active' : ''}" data-tag="Todos">Todos</button>`;

        const limiteFiltros = tagsExpandidos ? tagsOrdenados.length : 5;
        const tagsAMostrar = tagsOrdenados.slice(0, limiteFiltros);

        tagsAMostrar.forEach(tag => {
            const btn = document.createElement('button');
            btn.className = 'filter-btn';
            if (selectedTags.has(tag)) btn.classList.add('active');
            btn.dataset.tag = tag;
            btn.innerText = tag;
            filterContainer.appendChild(btn);
        });

        if (tagsOrdenados.length > 5) {
            const toggleBtn = document.createElement('button');
            toggleBtn.className = 'filter-btn toggle-tags-btn';
            toggleBtn.innerText = tagsExpandidos ? 'Ver menos...' : 'Ver más...';
            toggleBtn.onclick = (e) => {
                e.stopPropagation();
                tagsExpandidos = !tagsExpandidos;
                generateFilters(data); 
            };
            filterContainer.appendChild(toggleBtn);
        }
    }

    function createCard(news) {
        const card = document.createElement('div');
        card.className = 'news-card';
        
        const isLiked = userLikes.has(String(news.id));
        const likeClass = isLiked ? 'liked' : '';
        const fillAttr = isLiked ? 'fill="#ff3b30"' : '';

        card.innerHTML = `
            <div class="card-inner">
                <div class="card-front">
                    <img src="${news.img}" alt="Imagen noticia" class="card-img" loading="lazy">
                    <div class="card-content">
                        <div>
                            <div class="card-header-info">
                                <span class="date">📅 ${formatDate(news.date)}</span>
                            </div>
                            <h2 class="title">${news.title}</h2>
                            <div class="tags">
                                ${news.tags.map(tag => `<span class="tag" style="${getTagStyle(tag)}">${tag}</span>`).join('')}
                            </div>
                        </div>
                        <div class="actions">
                            <div class="btn-group">
                                <button class="action-btn like-btn ${likeClass}" onclick="toggleLike(event, '${news.id}', this)" title="Me gusta">
                                    <i data-lucide="heart" style="width: 18px;" ${fillAttr}></i>
                                </button>
                                <button class="action-btn" onclick="shareNews(event, '${news.title}', '${news.sourceUrl}')" title="Compartir">
                                    <i data-lucide="share-2" style="width: 18px;"></i>
                                </button>
                            </div>
                            <button class="btn-read btn-flip">Leer más</button>
                        </div>
                    </div>
                </div>
                <div class="card-back">
                    <div>
                        <div class="back-title">${news.title}</div>
                        <div class="back-text">
                            <p><strong>Resumen:</strong> ${news.summary}</p>
                            <p><strong>Profundidad:</strong> ${news.context}</p>
                        </div>
                    </div>
                    <div>
                        <a href="${news.sourceUrl}" class="source-link" target="_blank" rel="noopener" onclick="event.stopPropagation()">
                            <i data-lucide="external-link" style="width: 16px;"></i> Fuente: ${news.sourceName}
                        </a>
                        <div class="actions" style="border-top:none; padding-top:0;">
                            <div class="btn-group"></div>
                            <button class="btn-read btn-unflip">Volver ↩</button>
                        </div>
                    </div>
                </div>
            </div>
        `;

        card.addEventListener('click', () => card.classList.toggle('flipped'));
        card.querySelectorAll('.btn-flip, .btn-unflip').forEach(el => {
            el.addEventListener('click', (e) => { e.stopPropagation(); card.classList.toggle('flipped'); });
        });

        return card;
    }

    function renderFeed() {
        feedContainer.innerHTML = '';
        let targetData = newsData;

        if (currentView === 'likes') {
            if (!currentUser) {
                feedContainer.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color: var(--text-muted); margin-top:40px;">Inicia sesión para ver tu historial de Me Gusta.</p>`;
                btnCargarMas.style.display = 'none';
                return;
            }
            targetData = newsData.filter(n => userLikes.has(String(n.id)));
            if (targetData.length === 0) {
                feedContainer.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color: var(--text-muted); margin-top:40px;">Aún no has guardado ninguna noticia.</p>`;
                btnCargarMas.style.display = 'none';
                return;
            }
        } 
        else if (currentView === 'feed') {
            if (!currentUser || userLikes.size === 0) {
                feedContainer.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color: var(--text-muted); margin-top:40px;">Dale "Me Gusta" a algunas noticias para que nuestro algoritmo te recomiende contenido similar.</p>`;
                btnCargarMas.style.display = 'none';
                return;
            }
            let likedTags = new Set();
            newsData.forEach(n => {
                if(userLikes.has(String(n.id))) n.tags.forEach(t => likedTags.add(t));
            });
            targetData = newsData.filter(n => !userLikes.has(String(n.id)) && n.tags.some(tag => likedTags.has(tag)));
            
            if (targetData.length === 0) {
                feedContainer.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color: var(--text-muted); margin-top:40px;">Estás al día. No hay nuevas recomendaciones por ahora.</p>`;
                btnCargarMas.style.display = 'none';
                return;
            }
        }

        if (selectedTags.size > 0) {
            targetData = targetData.filter(news => news.tags.some(tag => selectedTags.has(tag)));
        }
        
        if(targetData.length === 0 && currentView === 'todo') {
            feedContainer.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color: var(--text-muted); margin-top:40px;">No hay noticias con las temáticas seleccionadas.</p>`;
            btnCargarMas.style.display = 'none';
            return;
        }

        const noticiasAMostrar = targetData.slice(0, limiteNoticias);
        noticiasAMostrar.forEach(news => feedContainer.appendChild(createCard(news)));

        btnCargarMas.style.display = (limiteNoticias >= targetData.length) ? 'none' : 'block';

        lucide.createIcons();
    }

    btnCargarMas.addEventListener('click', () => {
        limiteNoticias += 25;
        renderFeed();
    });

    filterContainer.addEventListener('click', (e) => {
        if(e.target.classList.contains('filter-btn') && !e.target.classList.contains('toggle-tags-btn')) {
            const tag = e.target.dataset.tag;
            if (tag === 'Todos') selectedTags.clear();
            else {
                if (selectedTags.has(tag)) selectedTags.delete(tag);
                else selectedTags.add(tag);
            }
            limiteNoticias = 25; 
            generateFilters(newsData); 
            renderFeed();
        }
    });

    fetchNews();
</script>
</body>
</html>
